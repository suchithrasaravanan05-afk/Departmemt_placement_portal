<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>

<style>

:root {
    --primary: #1d3853;
    --secondary: #34495e;
    --accent: #3498db;
    --text: #333;
    --light: #f4f7f6;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, sans-serif;
}

body {
    background: linear-gradient(to right, var(--primary), var(--secondary));
    padding: 30px;
    color: var(--text);
}

.college-header {
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--white);
    padding: 20px;
    border-radius: 12px;
    gap: 20px;
}

.header-left img {
    width: 80px;
    border-radius: 6px;
}

.header-center {
    text-align: center;
}

.header-center h1 {
    color: var(--primary);
    font-size: 26px;
    margin: 5px 0;
}

.header-center p {
    font-size: 13px;
    color: var(--secondary);
}

.dept-title {
    background: var(--accent);
    color: var(--white);
    text-align: center;
    font-size: 24px;
    padding: 14px;
    border-radius: 10px;
    margin: 20px 0 30px;
}


.container {
    max-width: 1000px;
    margin: auto;
    background: var(--white);
    padding: 35px 45px;
    border-radius: 14px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
}

h2 {
    text-align: center;
    color: var(--primary);
    margin-bottom: 30px;
}


.form-row {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
}

label {
    font-weight: 600;
    color: var(--secondary);
    margin-bottom: 5px;
}

input, select {
    padding: 11px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
}


.form-actions {
    text-align: center;
    margin-top: 25px;
}

button {
    padding: 12px 30px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin: 5px;
}

.submit {
    background: var(--primary);
    color: var(--white);
}

.reset {
    background: var(--secondary);
    color: var(--white);
}


table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 30px;
}

th, td {
    padding: 10px;
    border: 1px solid #ccc;
    text-align: center;
}

th {
    background: var(--primary);
    color: var(--white);
}

.edit-btn {
    background: var(--accent);
    color: var(--white);
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
}


@media(max-width:768px) {
    .form-row {
        flex-direction: column;
    }
}
</style>
</head>

<body>


<div class="college-header">
    <div class="header-left">
        <img src="chapht1.png" alt="Founder">
        <img src="chapht2.png" alt="Chairman">
    </div>
    <div class="header-center">
        <h1>RAMCO INSTITUTE OF TECHNOLOGY</h1>
        <p>Approved by AICTE,New Delhi & Affiliated to Anna University</p>
        <p>NAAC & NBA Accredited with 'A+' Grade & Affiliated to Anna Univers</p>
    </div>
</div>

<div class="dept-title">
    Department of Computer Science and Business Systems
</div>


<div class="container">
<h2>Admin Panel</h2>

<form id="studentForm">
    
        <div class="form-row">
            <div class="form-group">
                <label>Year</label>
                <select id="yearSelect" required>

                    <option value="">Select Year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
            </div>
            <div class="form-group">
                <label>Register number</label>
                <select id="regSelect" required>
                    <option value="">Select Register Number</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Student Name</label>
                <select id="stdSelect" required>
                    <option value=""> Select Student Name</option>
                </select>
                
            </div>
            <div class="form-group">
                <label>Domain</label>
                <input type="domain" required>
                
            </div>

             
        </div>


    <div class="form-actions">
        <button type="submit" class="submit">Save / Update</button>
        <button type="reset" class="reset">Reset</button>
    </div>
</form>

<h2>Registered Students</h2>

<table>
<thead>
<tr>
    <th>Year</th>
    <th>Register No</th>
    <th>Name</th>
    <th>Domain</th>
    <th>Action</th>

</tr>
</thead>
<tbody id="studentTable"></tbody>
</table>

</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="admin_dashboard.js"></script>




</body>
</html>
