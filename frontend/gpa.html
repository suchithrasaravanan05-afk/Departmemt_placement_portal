<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>

    <link rel="stylesheet" href="gpa.css">
</head>
<body>

<div class="container">

    <a href="student_dashboard.html" class="back-link">&larr; Back to Dashboard</a>

    <!-- Header -->
     
    <div class="header">
        <h1>RAMCO INSTITUTE OF TECHNOLOGY</h1>
        <p>Department of Computer Science and Business Systems</p>
    </div>

    <!-- GPA Card -->
    <div class="card">

        <h2>Semester GPA Calculator</h2>

        <!-- Regulation -->
        <div class="form-group">
            <label>Choose Regulation</label>

            <select id="regulation">
                <option value="">Select Regulation</option>
                <option value="2025">Regulation 2025</option>
                <option value="2021">Regulation 2021</option>
            </select>
        </div>

        

        <!-- Department -->

        <div class="form-group">
            <label>Choose Department</label>

            <select id="department">

                <option value="">Select Department</option>

                <option>CSBS</option>
                

            </select>

        </div>

        <!-- Semester -->

        <div class="form-group">

            <label>Semester</label>

            <select id="semester">

                <option value="">Select Semester</option>

                <option>Semester 1</option>
                <option>Semester 2</option>
                <option>Semester 3</option>
                <option>Semester 4</option>
                <option>Semester 5</option>
                <option>Semester 6</option>
                <option>Semester 7</option>
                <option>Semester 8</option>

            </select>

        </div> 
        <!-- Course Type -->   
        
        <!-- Course Type -->

<div id="courseTypeSection" style="display:none;">

    <div class="form-group">

        <label>Course Type</label>

        <select id="courseType">
    <option value="">Select Course Type</option>
    <option value="Regular">Regular Course</option>
    <option value="Honours">Honours Course</option>
</select>

    </div>

</div>



        <!-- Subject Area -->

        <div id="subjectsContainer">

        </div>

        <!-- Buttons -->

        



        <div class="button-group">

            <button id="calculateBtn">
                Calculate GPA
            </button>

            <button id="resetBtn">
                Reset
            </button>
            

        </div>

        <!-- Result -->

        <div class="result">

            <h3>Your GPA</h3>

            <h1 id="gpaResult">0.00</h1>

        </div>

    </div>

</div>

<script src="gpa.js"></script>

</body>
</html>
