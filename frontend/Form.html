<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIT CSBS Placement Portal — Login & Register</title>
  <meta name="description" content="Login or register to the Ramco Institute of Technology CSBS Department Placement Portal.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="Form.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="form-auth-bg">

  <!-- College Header -->
  <header class="form-header-wrapper">
    <div class="form-header">
      <div class="form-logo-group">
        <img src="rit_logo.png" alt="Ramco Institute of Technology Logo" class="form-logo-img">
        <div class="form-logo-text">
          <h1>RAMCO INSTITUTE OF TECHNOLOGY</h1>
        </div>
      </div>
    </div>
  </header>

  <div class="form-dept-banner">
    <div class="form-dept-banner-inner">
      <div class="form-dept-logo-wrap" title="Department of Computer Science and Business Systems">
        <img src="csbs_logo.png" alt="Department of Computer Science and Business Systems Logo" class="form-dept-logo-img">
      </div>
      <h2 class="form-dept-title">DEPARTMENT OF COMPUTER SCIENCE AND BUSINESS SYSTEMS (CSBS)</h2>
      <span class="form-dept-divider">•</span>
      <h2 class="form-dept-portal-title">PLACEMENT PORTAL</h2>
    </div>
  </div>

  <!-- Auth Section -->
  <main class="form-auth-wrapper">
    <div class="form-bg-circle c1"></div>
    <div class="form-bg-circle c2"></div>
    <div class="form-bg-circle c3"></div>

    <div class="form-auth-card">
      <div class="form-auth-header">
        <div class="form-auth-logo-wrap">
          <i class="fa-solid fa-briefcase"></i>
        </div>
        <h2 id="formTitle">Student Login</h2>
        <p id="formSub">Sign in with your register number</p>
      </div>

      <!-- Role Selector -->
      <div class="form-role-selector">
        <button class="form-role-btn active" id="btnRoleStudent" onclick="setRole('student')">
          <i class="fa-solid fa-user-graduate"></i> Student
        </button>
        <button class="form-role-btn" id="btnRoleAdmin" onclick="setRole('admin')">
          <i class="fa-solid fa-user-shield"></i> Placement Admin
        </button>
      </div>

      <!-- Alert Box -->
      <div id="authAlert" class="form-hidden"></div>

      <!-- ===== LOGIN FORM ===== -->
      <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
        <div class="form-field-group">
          <label id="lblLoginEmail">
            <i class="fa-solid fa-id-card" style="margin-right:4px;"></i>
            Register Number
          </label>
          <div class="form-input-wrapper">
            <i class="fa-solid fa-hashtag form-input-icon" id="loginInputIcon"></i>
            <input
              type="text"
              id="loginEmail"
              class="form-input-control"
              placeholder="Enter your register number"
              required
              autocomplete="off"
            >
          </div>
        </div>

        <div class="form-field-group">
          <label>
            <i class="fa-solid fa-lock" style="margin-right:4px;"></i>
            Password
          </label>
          <div class="form-password-wrapper">
            <input
              type="password"
              id="loginPassword"
              class="form-input-control"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button type="button" class="form-toggle-pw" onclick="togglePw('loginPassword', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="form-submit-btn" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket"></i> Login to Portal
        </button>

        <p class="form-auth-switch">
          New user? <span onclick="toggleAuthMode()">Create an account</span>
        </p>
      </form>

      <!-- ===== REGISTER FORM ===== -->
      <form id="registerForm" class="form-hidden" onsubmit="handleRegister(event)" novalidate>
        <div class="form-field-group">
          <label>
            <i class="fa-solid fa-user" style="margin-right:4px;"></i>
            Full Name
          </label>
          <div class="form-input-wrapper">
            <i class="fa-solid fa-user form-input-icon"></i>
            <input type="text" id="regFullName" class="form-input-control" placeholder="e.g. Anand Kumar S" required autocomplete="name">
          </div>
        </div>

        <div class="form-field-group" id="grpRegisterNo">
          <label>
            <i class="fa-solid fa-id-badge" style="margin-right:4px;"></i>
            Register Number <span style="color:#94a3b8;font-weight:500;">(12-digit)</span>
          </label>
          <div class="form-input-wrapper">
            <i class="fa-solid fa-hashtag form-input-icon"></i>
            <input type="text" id="regRegisterNo" class="form-input-control" placeholder="e.g. 953623244001" maxlength="12" autocomplete="off">
          </div>
        </div>

        <div class="form-field-group">
          <label>
            <i class="fa-solid fa-envelope" style="margin-right:4px;"></i>
            Email Address
          </label>
          <div class="form-input-wrapper">
            <i class="fa-solid fa-envelope form-input-icon"></i>
            <input type="email" id="regEmail" class="form-input-control" placeholder="e.g. student@rit.ac.in" required autocomplete="email">
          </div>
        </div>

        <div class="form-field-group">
          <label>
            <i class="fa-solid fa-lock" style="margin-right:4px;"></i>
            Password <span style="color:#94a3b8;font-weight:500;">(min 6 chars)</span>
          </label>
          <div class="form-password-wrapper">
            <input type="password" id="regPassword" class="form-input-control" placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
            <button type="button" class="form-toggle-pw" onclick="togglePw('regPassword', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-grid-row" id="grpStudentDetails">
          <div class="form-field-group" style="margin-bottom:0;">
            <label>Academic Year</label>
            <select id="regYear" class="form-input-control" style="padding-left:14px;">
              <option value="5">2022-2026 (Passed Out)</option>
              <option value="4" selected>2023-2027 (Default Year)</option>
              <option value="3">2024-2028</option>
              <option value="2">2025-2029</option>
              <option value="1">2026-2030</option>
            </select>
          </div>
          <div class="form-field-group" style="margin-bottom:0;">
            <label>Phone Number</label>
            <div class="form-input-wrapper">
              <i class="fa-solid fa-phone form-input-icon"></i>
              <input type="tel" id="regPhone" class="form-input-control" placeholder="10-digit mobile" maxlength="10" autocomplete="tel">
            </div>
          </div>
        </div>

        <button type="submit" class="form-submit-btn" id="registerBtn">
          <i class="fa-solid fa-user-plus"></i> Register Account
        </button>

        <p class="form-auth-switch">
          Already registered? <span onclick="toggleAuthMode()">Back to Login</span>
        </p>
      </form>
    </div>
  </main>

  <script src="Form.js"></script>
</body>
</html>
